services:
  - type: web
    name: render-cloud-runner
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 180
    envVars:
      - key: RUNNER_SECRET_KEY
        value: antigravity_cloud_master_2026
